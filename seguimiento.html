<!doctype html>
<html lang="en" data-default-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu pedido · Casa de Flores</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#13302a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18191b" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap">
<link rel="stylesheet" href="/styles.css">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/emblem.png">
</head>
<body>
<div class="center" style="max-width:440px;padding-top:32px">
  <div class="prefs" style="justify-content:flex-end">
      <div class="settings">
        <button class="iconbtn" type="button" data-settings aria-expanded="false" aria-label="Ajustes" data-i18n-aria="settings" title="Ajustes">⚙</button>
        <div class="menu" hidden>
          <div class="mrow"><span data-i18n="language">Idioma</span><div class="seg lang"><button type="button" data-lang="es">ES</button><button type="button" data-lang="en">EN</button></div></div>
          <div class="mrow"><span data-i18n="textSize">Tamaño de letra</span><div class="seg"><button type="button" data-size="" data-i18n="normal">Normal</button><button type="button" data-size="lg" data-i18n="large">Grande</button></div></div>
          <div class="mrow"><span data-i18n="theme">Modo</span><div class="seg"><button type="button" data-theme-set="" data-i18n="auto">Auto</button><button type="button" data-theme-set="light" data-i18n="light">Claro</button><button type="button" data-theme-set="dark" data-i18n="dark">Oscuro</button></div></div>
        </div>
      </div>
    </div>
  <div class="logo"><img class="on-light" src="/img/logo.png" alt="Casa de Flores · Flores para la vida" width="900" height="243"><img class="on-dark" src="/img/logo-dark.png" alt="Casa de Flores · Flores para la vida" width="900" height="243"></div>
  <p class="meta" style="margin:0;text-align:center" data-i18n="trackSub">Seguimiento de tu pedido</p>
  <div class="card" id="card"><h2 data-i18n="loadingOrder">Cargando tu pedido…</h2></div>
  <p class="meta" style="text-align:center;margin:0" data-i18n="autoRefresh">Esta página se actualiza sola cuando cambia el estado.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="/config.js"></script>
<script src="/i18n.js"></script>
<script>
const { url, anonKey } = window.CDF_CONFIG;
const sb = supabase.createClient(url, anonKey, { auth: { persistSession: false } });
const STEPS = ["Preparing", "Ready", "In transit", "Delivered"];
const code = (location.pathname.match(/\/p\/([a-z0-9]+)/i) || [])[1] || new URLSearchParams(location.search).get("c") || "";
const card = document.getElementById("card");
const h = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

let last = null;
async function load() {
  const { data, error } = await sb.rpc("cdf_track", { p_code: code });
  last = { o: data && data[0], error };
  render();
}
function render() {
  if (!last) return;
  const { o, error } = last;
  if (error || !o) {
    card.replaceChildren(h("h2", null, t("notFound")), h("div", "meta", t("notFoundTxt")));
    return;
  }
  const failed = o.delivery === "Failed";
  const cur = failed ? 3 : o.delivery === "Delivered" ? 3 : o.delivery === "In transit" ? 2 : o.status === "Ready" ? 1 : 0;
  const [y, m, d] = o.date.split("-").map(Number);
  const head = h("div");
  head.append(h("h2", null, t("order", { num: o.num })), h("div", "meta", cap(new Date(y, m - 1, d).toLocaleDateString(locale(), { weekday: "long", day: "numeric", month: "long" })) + " · " + o.slot));
  const tl = h("ol", "tl");
  STEPS.forEach((label, i) => {
    // A failed attempt replaces the last step: in transit is done, delivery didn't happen.
    const isFail = failed && i === 3;
    const txt = isFail ? t("failedTxt") : t("stepTxt")[i];
    const li = h("li", isFail ? "fail" : i < cur ? "past" : i === cur ? "cur" : "");
    const body = h("div"); body.append(h("b", null, isFail ? t("failedTitle") : label), h("small", null, txt));
    li.append(h("span", "dot", isFail ? "!" : i < cur ? "✓" : ""), body); tl.append(li);
  });
  const extra = [];
  if (o.delivery_note) extra.push(h("div", "note", o.delivery_note));
  if (o.proof_path) {
    const img = h("img"); img.src = url + "/storage/v1/object/public/cdf-entregas/" + o.proof_path; img.alt = t("proofPhoto");
    img.style.cssText = "border-radius:10px;width:100%;max-height:320px;object-fit:cover";
    extra.push(img);
  }
  const upd = h("div", "meta", t("updated", { when: new Date(o.updated_at).toLocaleString(locale(), { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) }));
  card.replaceChildren(head, tl, ...extra, upd);
}
document.addEventListener("langchange", render);
load();
setInterval(() => { if (!document.hidden) load(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
